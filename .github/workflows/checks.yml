name: Wear OS checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      watch_face:
        description: 'Select watch face to build/publish'
        type: choice
        options:
          - both
          - halo
          - lotr
        default: both
      publish_test_release:
        description: Publish the locally signed and verified test APK
        type: boolean
        default: false
      asset_commit:
        description: Exact commit of the staged APK and reports (no private keys)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: wearos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Release gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '13114758'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install pinned Android packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify WFF and test APKs
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: bash scripts/verify.sh
      - name: Upload HALO artifact
        if: (always()) && (github.event_name != 'workflow_dispatch' || inputs.watch_face == 'halo' || inputs.watch_face == 'both') && hashFiles('watchface/build/outputs/apk/debug/*') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: halo-watchface-${{ github.sha }}
          path: |
            watchface/build/outputs/apk/debug/watchface-debug.apk
            dist/verify/
            dist/spartan-night-*.png
          retention-days: 14
          if-no-files-found: error
      - name: Upload LOTR artifact
        if: (always()) && (github.event_name != 'workflow_dispatch' || inputs.watch_face == 'lotr' || inputs.watch_face == 'both') && hashFiles('lotr/build/outputs/apk/debug/*') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lotr-watchface-${{ github.sha }}
          path: |
            lotr/build/outputs/apk/debug/lotr-debug.apk
            dist/lotr-mockup-*.png
          retention-days: 14
          if-no-files-found: error

  publish:
    name: Publish test prerelease
    if: github.event_name == 'workflow_dispatch' && inputs.publish_test_release && github.ref == 'refs/heads/main' && (inputs.watch_face == 'halo' || inputs.watch_face == 'both')
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.asset_commit }}
          path: release-inputs
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '13114758'
          packages: platform-tools build-tools;36.0.0
          log-accepted-android-sdk-licenses: false
      - name: Validate and publish the retained-key APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-test-release.py --from-staged release-inputs
